{{- if .Values.global.langfuse.enabled }}
{{- $langfuseNamespace := printf "%s-langfuse" .Release.Namespace }}
{{- $langfuseSecret := lookup "v1" "Secret" $langfuseNamespace "langfuse-general" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-langfuse-secrets
  labels:
    app.kubernetes.io/name: langfuse-secrets
type: Opaque
data:
  # Secret values to be filled by the user
  # The values need to be base64 encoded
  LANGFUSE_HOST: {{- if .Values.global.langfuse.host }}{{ .Values.global.langfuse.host | b64enc | quote }}{{- else if and $langfuseSecret (hasKey $langfuseSecret.data "host") }}{{ index $langfuseSecret.data "host" | quote }}{{- else if and $langfuseSecret (hasKey $langfuseSecret.data "LANGFUSE_HOST") }}{{ index $langfuseSecret.data "LANGFUSE_HOST" | quote }}{{- end }}
  LANGFUSE_PUBLIC_KEY: {{- if .Values.global.langfuse.publicKey }}{{ .Values.global.langfuse.publicKey | b64enc | quote }}{{- else if and $langfuseSecret (hasKey $langfuseSecret.data "publicKey") }}{{ index $langfuseSecret.data "publicKey" | quote }}{{- else if and $langfuseSecret (hasKey $langfuseSecret.data "LANGFUSE_PUBLIC_KEY") }}{{ index $langfuseSecret.data "LANGFUSE_PUBLIC_KEY" | quote }}{{- end }}
  LANGFUSE_SECRET_KEY: {{- if .Values.global.langfuse.secretKey }}{{ .Values.global.langfuse.secretKey | b64enc | quote }}{{- else if and $langfuseSecret (hasKey $langfuseSecret.data "secretKey") }}{{ index $langfuseSecret.data "secretKey" | quote }}{{- else if and $langfuseSecret (hasKey $langfuseSecret.data "LANGFUSE_SECRET_KEY") }}{{ index $langfuseSecret.data "LANGFUSE_SECRET_KEY" | quote }}{{- end }}
{{- end }}
